name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go-test:
    runs-on: arc-runner
    steps:
      - uses: actions/checkout@v4

      # arc-runner images are minimal — install Go the same way build.yml
      # installs the az CLI (in-step, idempotent). Bake Go into the
      # arc-runner image later to skip this download.
      - name: Install Go
        run: |
          set -euo pipefail
          GO_VERSION=1.25.1
          if ! command -v go >/dev/null 2>&1 \
             || [ "$(go version | awk '{print $3}')" != "go${GO_VERSION}" ]; then
            curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf /tmp/go.tgz
          fi
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: cross-compile
        run: |
          set -euo pipefail
          for t in darwin/amd64 darwin/arm64 windows/amd64 linux/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} \
              go build -ldflags "-X main.version=ci" -o /dev/null ./cmd/keyto
          done
