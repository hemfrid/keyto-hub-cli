name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Keeps setup-go's default cache on: release.yml sets cache: false, so a
      # cache saved here never reaches a release build.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: cross-compile
        run: |
          set -euo pipefail
          for t in darwin/amd64 darwin/arm64 windows/amd64 linux/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} \
              go build -ldflags "-X main.version=ci" -o /dev/null ./cmd/keyto
          done
