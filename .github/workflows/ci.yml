name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keeps setup-go's default cache on: release.yml sets cache: false, so a
      # cache saved here never reaches a release build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: cross-compile
        run: |
          set -euo pipefail
          for t in darwin/amd64 darwin/arm64 windows/amd64 linux/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} \
              go build -ldflags "-X main.version=ci" -o /dev/null ./cmd/keyto
          done
