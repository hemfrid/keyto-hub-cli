name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: cross-compile
        run: |
          set -euo pipefail
          for t in darwin/amd64 darwin/arm64 windows/amd64 linux/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} \
              go build -ldflags "-X main.version=ci" -o /dev/null ./cmd/keyto
          done
