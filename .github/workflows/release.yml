name: release

# Tag-triggered release: builds the cross-platform binaries and publishes
# them (+ sha256 checksums) to a GitHub Release. The one-line installer
# (install.sh / install.ps1) and `keyto update` fetch the asset for the
# host's GOOS/GOARCH from here. Asset names match Go's runtime.GOOS/GOARCH
# so the client can compute the name without a manifest.
#
# Jobs: build → defender → publish.
#
# defender adds the Windows binary's sha256 as an "Allowed" file indicator in
# Microsoft Defender for Endpoint on the hemfrid tenant
# (scripts/defender-allow-hash.sh), so it is allowed before anyone can run
# `keyto update`. It is the only job that can mint an OIDC token, and it runs
# no third-party code after logging in: that token can allow-list any file on
# hemfrid devices. The hash is taken from checksums.txt, so any step that
# rewrites the .exe (e.g. Authenticode signing) must run in build before that.
#
# Defender config (Settings → Secrets and variables → Actions, no secrets):
#   vars.DEFENDER_CLIENT_ID   Entra app in the hemfrid tenant with application
#                             permission WindowsDefenderATP Ti.ReadWrite.All and a
#                             federated credential for
#                             repo:hemfrid/keyto-hub-cli:environment:release
#   vars.DEFENDER_TENANT_ID   hemfrid tenant id
#   vars.DEFENDER_RBAC_GROUPS optional, comma-separated device groups; unset = all devices
#   vars.DEFENDER_KEEP        optional, releases kept allowed (default 5)
# The federated credential trusts the `release` environment, so protect it:
# allow only v* tags, require a reviewer, and restrict who may create v* tags
# with a tag ruleset.
# While DEFENDER_CLIENT_ID is unset, defender is skipped and publish warns.
# Once set, a failed Defender call stops the release before it is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      windows_sha256: ${{ steps.checksums.outputs.windows_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"   # the tag, e.g. v0.1.0
          mkdir -p dist
          for t in darwin/amd64 darwin/arm64 windows/amd64 linux/amd64; do
            GOOS="${t%/*}"; GOARCH="${t#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            out="dist/keyto_${GOOS}_${GOARCH}${ext}"
            GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cmd/keyto
          done

      - name: Checksums
        id: checksums
        run: |
          set -euo pipefail
          ( cd dist && sha256sum keyto_* > checksums.txt )
          ls -l dist
          hash="$(awk '$2 == "keyto_windows_amd64.exe" {print $1}' dist/checksums.txt)"
          [ -n "$hash" ] || { echo "::error::keyto_windows_amd64.exe missing from checksums.txt"; exit 1; }
          echo "windows_sha256=$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  defender:
    needs: build
    if: vars.DEFENDER_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC login to the hemfrid tenant for the Defender API
    # Every step here can mint an OIDC token, so every action is pinned to a
    # commit SHA and nothing else is fetched or run.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure login (hemfrid tenant, OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.DEFENDER_CLIENT_ID }}
          tenant-id: ${{ vars.DEFENDER_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Allow Windows binary in Defender
        env:
          VERSION: ${{ github.ref_name }}
          HASH: ${{ needs.build.outputs.windows_sha256 }}
          KEEP: ${{ vars.DEFENDER_KEEP || '5' }}
          RBAC_GROUPS: ${{ vars.DEFENDER_RBAC_GROUPS }}
        run: |
          set -euo pipefail
          DEFENDER_TOKEN="$(az account get-access-token \
            --resource https://api.securitycenter.microsoft.com \
            --query accessToken -o tsv)"
          echo "::add-mask::$DEFENDER_TOKEN"
          export DEFENDER_TOKEN
          ./scripts/defender-allow-hash.sh

      - name: Azure logout
        if: always()
        run: az logout || true

  publish:
    needs: [build, defender]
    # Run when build succeeded and defender either succeeded or was skipped
    # (not configured); never after a Defender failure.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.defender.result == 'success' || needs.defender.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check published binary matches the allowed hash
        env:
          HASH: ${{ needs.build.outputs.windows_sha256 }}
          DEFENDER: ${{ needs.defender.result }}
        run: |
          set -euo pipefail
          echo "$HASH  dist/keyto_windows_amd64.exe" | sha256sum -c -
          if [ "$DEFENDER" = "skipped" ]; then
            echo "::warning::Defender is not configured (DEFENDER_CLIENT_ID unset): add $HASH as an Allowed file indicator by hand."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
